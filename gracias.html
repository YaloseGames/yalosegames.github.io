<div class="page">

  <header class="topbar">
    <a class="brand" href="index.html"><img src="assets/img/deco/logo-yalose.webp" alt=""><span>YaloséGames</span></a>
    <nav class="nav" aria-label="Principal">

  <section class="page-hero">
