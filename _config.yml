# GitHub Pages construye con Jekyll SOLO el blog.
# Las páginas .html normales (index, tourist-trap…) no llevan cabecera YAML, así que se copian tal cual.

title: YaloséGames
lang: es
url: https://yalosegames.github.io
timezone: Europe/Madrid

# Blog público: sale «Blog» en el menú y Google puede indexarlo.
# Para ocultarlo otra vez: pon false y quita «Blog» del menú de las páginas (ver BLOG.md).
blog_publico: true

permalink: /blog/:title/

# Blog en inglés: cada post va en _en_posts/ (nombre sin fecha; la fecha va en la cabecera)
collections:
  en_posts:
    output: true
    permalink: /en/blog/:title/
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

exclude:
  - README.md
  - DISEÑO.md
  - BLOG.md
  - versionar.py
  - traducir.py
