<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'none'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; object-src 'none'; base-uri 'self'; form-action https://formsubmit.co">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#8ad6e3">
<title>{% if page.numero != nil %}Devlog #{{ page.numero }}: {{ page.title }}{% else %}{{ page.title }}{% endif %} — YaloséGames</title>
<meta name="description" content="{{ page.resumen | default: 'Diario de desarrollo de Tourist Trap, de YaloséGames.' | escape }}">
{% unless site.blog_publico %}<meta name="robots" content="noindex">{% endunless %}
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:type" content="{% if page.numero != nil %}article{% else %}website{% endif %}">
<meta property="og:title" content="{{ page.title | escape }} — YaloséGames">
<meta property="og:description" content="{{ page.resumen | default: 'Diario de desarrollo de Tourist Trap, de YaloséGames.' | escape }}">
<meta property="og:image" content="{{ site.url }}{{ page.portada | default: '/assets/img/keyart.jpg' }}">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="/style.css?v=1cc8a058">
</head>
<body class="p-blog">

<!-- Día / noche sin JavaScript: el sol / la luna (label) marca este checkbox y la paleta cambia en .page -->
<input type="checkbox" id="night" class="night-toggle" aria-label="Modo noche">
<div class="page">

  <header class="topbar">
    <a class="brand" href="/index.html"><img src="/assets/img/deco/logo-yalose.webp" alt=""><span>YaloséGames</span></a>
    <nav class="nav" aria-label="Principal">
      <a href="/index.html">Inicio</a>
      <a href="/tourist-trap.html">Tourist Trap</a>
      <a href="/quienes-somos.html">Quiénes somos</a>
      {% if site.blog_publico %}<a href="/blog/" class="is-active" aria-current="page">Blog</a>{% endif %}
      <a href="/contacto.html" class="nav-cta">Contacto</a>
    </nav>
    <label for="night" class="nav-sky" title="¿Día o noche?">
      <img class="sun" src="/assets/img/deco/sol.webp" alt="">
      <img class="moon" src="/assets/img/deco/luna.webp" alt="">
    </label>
  </header>

{{ content }}

  <div class="tiles-band" aria-hidden="true"></div>
  <footer class="footer">
    <span>© 2026 YaloséGames · Málaga</span>
    <nav class="foot-nav">
      <a href="/tourist-trap.html">Tourist Trap</a>
      <a href="/quienes-somos.html">Quiénes somos</a>
      <a href="/contacto.html">Contacto</a>
    </nav>
    <span class="wip">Web en construcción</span>
  </footer>

</div>
</body>
</html>
