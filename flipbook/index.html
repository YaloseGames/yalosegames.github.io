<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Libro de arte · Tourist Trap</title>
<style>
@font-face{font-family:"Lilita One";src:url("fonts/LilitaOne-Regular.ttf")}
@font-face{font-family:"Inter";font-weight:500;src:url("fonts/Inter-Medium.ttf")}
@font-face{font-family:"Inter";font-weight:700;src:url("fonts/Inter-Bold.ttf")}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{font-family:Inter,system-ui,sans-serif;font-weight:500;color:#fff;user-select:none;-webkit-user-select:none;
  background:
   repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 2px,transparent 2px 7px),
   repeating-linear-gradient(90deg,#b08e66 0 120px,#a98458 120px 240px,#b89870 240px 360px,#a4814f 360px 480px);}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.35))}
#stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:grab}
#stage.pan{cursor:grabbing}
#zoom{transition:transform .25s ease-out}
#zoom.drag{transition:none}
#book{position:relative;transition:transform .6s ease-in-out}
#book::before{content:"";position:absolute;left:0;right:0;bottom:-4px;height:10px;background:rgba(0,0,0,.5);filter:blur(10px)}
.leaf{position:absolute;left:50%;top:0;transform-origin:left center;transform-style:preserve-3d;
  transition:transform .85s cubic-bezier(.45,.05,.25,1)}
.leaf.flipped{transform:rotateY(-180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#f3efe4;overflow:hidden}
.face.cover{background:#3E130F;display:grid;place-items:center}
.face.cover img{width:34%;height:auto}
.face img{width:100%;height:100%;display:block;-webkit-user-drag:none;pointer-events:none}
.face.back{transform:rotateY(180deg)}
.face::after{content:"";position:absolute;inset:0;pointer-events:none}
.face.front::after{background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(0,0,0,.06) 6%,transparent 14%)}
.face.back::after{background:linear-gradient(270deg,rgba(0,0,0,.28),rgba(0,0,0,.06) 6%,transparent 14%)}
.leaf.moving .face::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.0),rgba(0,0,0,.22));animation:sh .85s ease-in-out}
@keyframes sh{0%,100%{opacity:0}50%{opacity:1}}
.pill{position:fixed;z-index:10;background:rgba(80,60,40,.62);border-radius:22px;display:flex;align-items:center;color:#fff;backdrop-filter:blur(3px)}
#bar{top:14px;left:50%;transform:translateX(-50%);padding:0 10px;height:38px;gap:2px}
#bar button,.pill button{background:none;border:0;color:#fff;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;border-radius:50%}
#bar button:hover{background:rgba(255,255,255,.18)}
#bar button:disabled{opacity:.35;cursor:default}
#bar svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#bar i{width:1px;height:18px;background:rgba(255,255,255,.3);margin:0 4px}
#brand{top:10px;left:16px;height:46px}
#brand img{height:46px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
#cnt{top:14px;right:16px;height:34px;padding:0 14px;font:700 14px Inter}
#side{position:fixed;top:50%;width:42px;height:42px;margin-top:-21px;border-radius:50%;background:rgba(80,60,40,.62);border:0;color:#fff;cursor:pointer;z-index:9;display:grid;place-items:center;font-size:20px}
#side:disabled{opacity:.25;cursor:default}
#sl{left:10px}#sr{right:10px}
#foot{bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:14px;align-items:center;position:fixed;z-index:10}
.num{min-width:84px;height:30px;padding:0 14px;display:grid;place-items:center;border-radius:15px;background:rgba(80,60,40,.62);font:700 14px Inter}
#dots{display:flex;gap:7px;padding:9px 16px;border-radius:16px;background:rgba(80,60,40,.62);max-width:60vw;overflow:hidden}
#dots b{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.45);cursor:pointer;flex:none}
#dots b.on{background:#fff;transform:scale(1.25)}
#thumbs{position:fixed;inset:0;z-index:30;background:rgba(40,30,20,.92);overflow:auto;padding:70px 24px 24px;display:none}
#thumbs.on{display:block}
#thumbs .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px;max-width:1300px;margin:0 auto}
#thumbs a{display:block;color:#fff;font:700 13px Inter;text-align:center;text-decoration:none}
#thumbs img{width:100%;display:block;margin-bottom:5px;box-shadow:0 3px 10px rgba(0,0,0,.6);background:#f3efe4}
#thumbs a.cur img{outline:3px solid #F0BC5E}
#tclose{position:fixed;top:16px;right:20px;z-index:31;display:none;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;border:0;font-size:22px;cursor:pointer}
#thumbs.on ~ #tclose{display:block}
@media (max-width:700px){#brand,#cnt,#side{display:none}#dots{display:none}}
</style>
</head>
<body>
<div class="pill" id="brand"><img src="img/logo.png" alt="Tourist Trap"></div>
<div class="pill" id="bar">
  <button id="zi" title="Acercar"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="M15 15l5 5M10 7v6M7 10h6"/></svg></button>
  <button id="zo" title="Alejar"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="M15 15l5 5M7 10h6"/></svg></button>
  <i></i>
  <button id="bfirst" title="Primera"><svg viewBox="0 0 24 24"><path d="M18 6l-6 6 6 6M8 6v12"/></svg></button>
  <button id="bprev" title="Anterior"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button id="bnext" title="Siguiente"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  <button id="blast" title="Última"><svg viewBox="0 0 24 24"><path d="M6 6l6 6-6 6M16 6v12"/></svg></button>
  <i></i>
  <button id="bt" title="Miniaturas"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7"/><rect x="13" y="4" width="7" height="7"/><rect x="4" y="13" width="7" height="7"/><rect x="13" y="13" width="7" height="7"/></svg></button>
  <button id="bf" title="Pantalla completa"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</div>
<div class="pill" id="cnt"></div>
<div id="stage"><div id="zoom"><div id="book"></div></div></div>
<button id="sl" aria-label="Anterior">&#9664;</button><button id="sr" aria-label="Siguiente">&#9654;</button>
<div id="foot"><div class="num" id="nl"></div><div id="dots" class="pill" style="position:static"></div><div class="num" id="nr"></div></div>
<div id="thumbs"><div class="grid" id="grid"></div></div>
<button id="tclose">&#10005;</button>
<script src="pages.js"></script>
<script>
(function(){
  var F=window.FLIP,N=F.n,ratio=F.w/F.h;
  var L=Math.ceil(N/2);                 // hojas: hoja i = página 2i+1 (anverso) y 2i+2 (reverso)
  var maxF=L;                           // último estado: contraportada sola, libro cerrado por detrás
  var T=2*L;                            // páginas físicas (N impar → la última es la contraportada)
  var f=0,timers=[];
  var $=function(i){return document.getElementById(i)};
  var book=$("book"),leaves=[];
  var src=function(i){return "pages/"+String(i).padStart(3,"0")+".jpg"};
  document.title=F.title;

  function face(cls,p){
    var d=document.createElement("div");d.className="face "+cls;
    if(p>=1&&p<=N){var im=document.createElement("img");im.dataset.s=src(p);im.alt="";d.appendChild(im)}
    else if(p===N+1){d.classList.add("cover");var lg=document.createElement("img");lg.src="img/logo-yalose.png";lg.alt="";d.appendChild(lg)}
    return d;
  }
  for(var i=0;i<L;i++){
    var lf=document.createElement("div");lf.className="leaf";
    lf.appendChild(face("front",2*i+1));lf.appendChild(face("back",2*i+2));
    book.appendChild(lf);leaves.push(lf);
  }
  function load(lf){var im=lf.querySelectorAll("img");for(var k=0;k<im.length;k++)if(!im[k].src)im[k].src=im[k].dataset.s}

  var pw=0,ph=0;
  function fit(){
    var aw=innerWidth-(innerWidth>700?150:20),ah=innerHeight-(innerWidth>700?130:110);
    pw=Math.min(aw/2,ah*ratio);ph=pw/ratio;
    book.style.width=(2*pw)+"px";book.style.height=ph+"px";
    for(var i=0;i<L;i++){leaves[i].style.width=pw+"px";leaves[i].style.height=ph+"px"}
    shift();
  }
  function shift(){book.style.transform="translateX("+(f===0?-pw/2:(f===maxF?pw/2:0))+"px)"}
  function zs(){for(var i=0;i<L;i++)if(!leaves[i].classList.contains("moving"))leaves[i].style.zIndex=i<f?i:L-i}

  function label(){
    var lo=2*f,hi=2*f+1,t;
    if(f===0)t="1";else if(lo>N)t=""+N;else if(hi>N)t=""+lo;else t=lo+"-"+hi;
    $("cnt").textContent=t+" / "+N;
    var back=lo>N;
    $("nl").textContent=lo;$("nr").textContent=hi;
    $("nl").style.visibility=(f===0||back)?"hidden":"visible";$("nr").style.visibility=(hi>N)?"hidden":"visible";
    var h="#p="+(f===0?1:(back?N+1:lo));if(location.hash!==h)history.replaceState(null,"",h);
    var d=document.querySelectorAll("#dots b");for(var k=0;k<d.length;k++)d[k].className=(k===f)?"on":"";
    var a=document.querySelectorAll("#grid a");for(k=0;k<a.length;k++){var p=k+1;a[k].className=(p===lo||p===hi||(f===0&&p===1))?"cur":""}
    $("bprev").disabled=$("bfirst").disabled=$("sl").disabled=f===0;
    $("bnext").disabled=$("blast").disabled=$("sr").disabled=f===maxF;
  }

  function flip(i,toFlipped,delay){
    timers.push(setTimeout(function(){
      var lf=leaves[i];load(lf);lf.style.zIndex=999;lf.classList.add("moving");
      lf.classList.toggle("flipped",toFlipped);
      setTimeout(function(){lf.classList.remove("moving");zs()},880);
    },delay));
  }
  function setF(t){
    t=Math.max(0,Math.min(maxF,t));if(t===f)return;
    timers.forEach(clearTimeout);timers=[];
    var n=0,from=f;
    if(t>f){for(var i=f;i<t;i++)flip(i,true,(n++)*(t-f>3?70:0))}
    else{for(var j=f-1;j>=t;j--)flip(j,false,(n++)*(f-t>3?70:0))}
    f=t;shift();label();preload();
  }
  function preload(){for(var i=Math.max(0,f-3);i<=Math.min(L-1,f+3);i++)load(leaves[i])}
  function pageToF(p){return Math.floor(Math.max(1,Math.min(T,p))/2)}
  function instant(t){
    f=Math.max(0,Math.min(maxF,t));
    for(var i=0;i<L;i++)leaves[i].classList.toggle("flipped",i<f);
    zs();shift();label();preload();
  }
  function next(){setF(f+1)}function prev(){setF(f-1)}

  // zoom y arrastre
  var z=1,px=0,py=0,zoom=$("zoom"),stage=$("stage");
  function applyZ(){
    var mx=(z-1)*pw,my=(z-1)*ph/2;
    px=Math.max(-mx,Math.min(mx,px));py=Math.max(-my,Math.min(my,py));
    if(z===1){px=py=0}
    zoom.style.transform="translate("+px+"px,"+py+"px) scale("+z+")";
  }
  $("zi").onclick=function(){z=Math.min(3,z+.5);applyZ()};
  $("zo").onclick=function(){z=Math.max(1,z-.5);applyZ()};
  stage.addEventListener("wheel",function(e){e.preventDefault();z=Math.max(1,Math.min(3,z+(e.deltaY<0?.25:-.25)));applyZ()},{passive:false});
  var sx,sy,spx,spy,moved,down=false;
  stage.addEventListener("pointerdown",function(e){down=true;moved=false;sx=e.clientX;sy=e.clientY;spx=px;spy=py;if(z>1){stage.classList.add("pan");zoom.classList.add("drag")}});
  addEventListener("pointermove",function(e){
    if(!down)return;var dx=e.clientX-sx,dy=e.clientY-sy;
    if(Math.abs(dx)+Math.abs(dy)>6)moved=true;
    if(z>1){px=spx+dx;py=spy+dy;applyZ()}
  });
  addEventListener("pointerup",function(e){
    if(!down)return;down=false;stage.classList.remove("pan");zoom.classList.remove("drag");
    var dx=e.clientX-sx;
    if(z===1){
      if(Math.abs(dx)>50){dx<0?next():prev()}
      else if(!moved){var r=book.getBoundingClientRect();
        if(e.clientX>r.left+r.width/2){ if(!(f===0&&e.clientX<r.left+pw/2*0)) next(); } else prev();}
    }
  });

  $("bnext").onclick=$("sr").onclick=next;$("bprev").onclick=$("sl").onclick=prev;
  $("bfirst").onclick=function(){setF(0)};$("blast").onclick=function(){setF(maxF)};
  document.addEventListener("keydown",function(e){
    var k=e.key;
    if(k==="ArrowRight"||k==="PageDown")next();else if(k==="ArrowLeft"||k==="PageUp")prev();
    else if(k==="Home")setF(0);else if(k==="End")setF(maxF);
    else if(k==="Escape")$("thumbs").classList.remove("on");
    else if(k==="+"||k==="=")$("zi").onclick();else if(k==="-")$("zo").onclick();
    else if(k==="f"||k==="F")fs();
  });
  addEventListener("hashchange",function(){var m=/#p=(\d+)/.exec(location.hash);if(m&&pageToF(+m[1])!==f)setF(pageToF(+m[1]))});
  addEventListener("resize",fit);

  var dots=$("dots");
  for(var d=0;d<=maxF;d++){var b=document.createElement("b");b.dataset.f=d;b.onclick=function(e){e.stopPropagation();setF(+this.dataset.f)};dots.appendChild(b)}
  dots.addEventListener("pointerdown",function(e){e.stopPropagation()});
  var g=$("grid");
  for(var p=1;p<=N;p++){
    var a=document.createElement("a");a.href="#p="+p;a.dataset.p=p;
    a.innerHTML='<img loading="lazy" src="thumbs/'+String(p).padStart(3,"0")+'.jpg" alt="">'+p;
    a.onclick=function(e){e.preventDefault();$("thumbs").classList.remove("on");setF(pageToF(+this.dataset.p))};
    g.appendChild(a);
  }
  $("bt").onclick=function(){$("thumbs").classList.add("on")};
  $("tclose").onclick=function(){$("thumbs").classList.remove("on")};
  function fs(){var D=document,el=D.documentElement;if(D.fullscreenElement)D.exitFullscreen();else if(el.requestFullscreen)el.requestFullscreen()}
  $("bf").onclick=fs;if(!document.documentElement.requestFullscreen)$("bf").style.display="none";
  ["bar","brand","cnt","foot"].forEach(function(i){$(i).addEventListener("pointerdown",function(e){e.stopPropagation()})});
  $("sl").addEventListener("pointerdown",function(e){e.stopPropagation()});$("sr").addEventListener("pointerdown",function(e){e.stopPropagation()});

  fit();
  var m=/#p=(\d+)/.exec(location.hash);instant(m?pageToF(+m[1]):0);
})();
</script>
</body>
</html>
